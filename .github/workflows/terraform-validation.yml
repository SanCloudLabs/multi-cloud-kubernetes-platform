name: Terraform and Kubernetes Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  terraform-validate:

    name: Validate ${{ matrix.environment }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        environment:
          - environments/dev/eks
          - environments/prod/eks
          - environments/dev/aks
          - environments/prod/aks

    defaults:
      run:
        working-directory: ${{ matrix.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  kubernetes-validate:

    name: Validate Kubernetes Manifests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests
        run: |
          kubeconform \
            -summary \
            -strict \
            kubernetes/namespace/namespace.yaml \
            kubernetes/nginx/configmap.yaml \
            kubernetes/nginx/deployment.yaml \
            kubernetes/nginx/service.yaml \
            kubernetes/ingress/ingress.yaml \
            kubernetes/network-policy/network-policy.yaml \
            kubernetes/hpa/hpa.yaml