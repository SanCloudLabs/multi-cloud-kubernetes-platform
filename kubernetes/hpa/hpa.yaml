apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: demo-app-hpa
  namespace: demo-app

  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: multi-cloud-kubernetes-platform

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx

  minReplicas: 2

  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70