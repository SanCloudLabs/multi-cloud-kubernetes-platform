apiVersion: v1
kind: ConfigMap

metadata:
  name: nginx-config
  namespace: demo-app

data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Multi Cloud Kubernetes Platform</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          margin: 40px;
          background: #f4f4f4;
        }

        .container {
          background: white;
          padding: 30px;
          border-radius: 10px;
          max-width: 900px;
          margin: auto;
        }

        h1 {
          color: #0052cc;
        }

        table {
          border-collapse: collapse;
          width: 100%;
          margin-top: 20px;
        }

        td, th {
          border: 1px solid #ddd;
          padding: 10px;
        }

        th {
          background: #0052cc;
          color: white;
        }

        footer {
          margin-top: 30px;
          color: gray;
        }
      </style>
    </head>

    <body>

      <div class="container">

        <h1>Multi Cloud Kubernetes Platform</h1>

        <p>
          This sample application demonstrates a reusable Kubernetes platform
          deployed on Amazon EKS and Microsoft AKS using Terraform.
        </p>

        <table>

          <tr>
            <th>Technology</th>
            <th>Status</th>
          </tr>

          <tr>
            <td>Terraform</td>
            <td>✓</td>
          </tr>

          <tr>
            <td>Amazon EKS</td>
            <td>✓</td>
          </tr>

          <tr>
            <td>Azure AKS</td>
            <td>✓</td>
          </tr>

          <tr>
            <td>GitHub Actions</td>
            <td>✓</td>
          </tr>

          <tr>
            <td>Kubernetes</td>
            <td>✓</td>
          </tr>

        </table>

        <footer>
          Created for learning and portfolio demonstration.
        </footer>

      </div>

    </body>
    </html>