apiVersion: v1
kind: Service

metadata:
  name: demo-app-service
  namespace: demo-app
  
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: multi-cloud-kubernetes-platform
    app.kubernetes.io/managed-by: kubectl

spec:

  selector:
    app: demo-app

  ports:

  - port: 80
    targetPort: 80

  type: ClusterIP